[profile.default]
src = "src"
out = "out"
libs = ["lib"]
remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "@openzeppelin/contracts@4.8.3/=lib/openzeppelin-contracts/contracts/",
    "@openzeppelin/contracts@5.0.2/=lib/openzeppelin-contracts/contracts/",
    "@chainlink/contracts/=lib/chainlink-evm/contracts/",
    "@ccip/contracts/=lib/chainlink-ccip/chains/evm/contracts/",
    "@chainlink-local/=lib/chainlink-local/",
]
rpc_endpoints = { sepolia-eth = "https://eth-sepolia.g.alchemy.com/v2/P_WWyg26NojbbFRK5zf_p", arb-sepolia = "https://arb-sepolia.g.alchemy.com/v2/P_WWyg26NojbbFRK5zf_p" }

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
